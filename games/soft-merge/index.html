<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Soft Merge — local prototype</title><link rel="stylesheet" href="style.css"></head><body><canvas id="game" aria-label="Soft body merge playfield"></canvas><div id="hud"><button id="pause" aria-label="Pause game" title="Pause">Ⅱ</button><span id="score" aria-live="polite">0</span><button id="cancel" aria-label="Cancel launch" title="Cancel launch">×</button><button id="full" aria-label="Fullscreen" title="Fullscreen">⛶</button></div><section id="panel"><h1>soft merge</h1><p id="message">Drag down to aim. Release to launch.<br>Equal numbers merge. Keep clear of the side bumpers.</p><button id="start" aria-label="Start or resume game" title="Start or resume">▶ <span>Play</span></button><button id="restart" aria-label="Restart game" title="Restart">↻ <span>New game</span></button><p class="small">Independent local prototype · inspired by the Sobosuba demo<br>Mouse / touch · right click cancels · Esc pauses</p></section><script type="module" src="game.js"></script></body></html>
